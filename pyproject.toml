[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "ქონდაქარი (Kondakari): an autonomous kitchen & nutrition agent built with LangChain + LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "rich>=13.7",
    "streamlit>=1.50",
]

[project.optional-dependencies]
google = ["langchain-google-genai>=3.0"]
anthropic = ["langchain-anthropic>=1.0"]
groq = ["langchain-groq>=1.0"]
ollama = ["langchain-ollama>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
kondakari = "agent.cli:main"
kondakari-ui = "agent.web_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent = ["data/*.json", "assets/*.css", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
